<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Barshaa Chat</title>
<style>
body{font-family:system-ui,sans-serif;max-width:620px;margin:0 auto;padding:20px;background:#f5f5f5}.card{background:white;padding:20px;border-radius:16px;box-shadow:0 2px 12px #0001}input,button{padding:12px;font-size:16px;width:100%;box-sizing:border-box;margin:5px 0}button{cursor:pointer}.room{display:none}.messages{height:300px;overflow:auto;border:1px solid #ddd;padding:10px;margin:10px 0}.msg{padding:8px 10px;margin:6px 0;background:#f0f0f0;border-radius:10px}
</style></head>
<body>
<div class="card">
<h1>💬 Barshaa Chat</h1>
<p>Join a room with a shared code.</p>
<div id="join">
<input id="name" placeholder="Your name" maxlength="30">
<input id="code" placeholder="Room code (e.g. ABC123)" maxlength="12">
<button onclick="joinRoom()">Join Room</button>
</div>
<div id="room" class="room">
<p>Room: <b id="roomCode"></b></p>
<div id="messages" class="messages"></div>
<input id="text" placeholder="Type a message" maxlength="500" onkeydown="if(event.key==='Enter')send()">
<button onclick="send()">Send</button><button onclick="leave()">Leave Room</button>
</div>
</div>
<script>
let username='',room='';
const key=()=>`barshaa-room-${room}`;
function joinRoom(){
 username=document.getElementById('name').value.trim()||'Guest';
 room=document.getElementById('code').value.trim().toUpperCase();
 if(!room)return alert('Enter a room code.');
 document.getElementById('join').style.display='none';document.getElementById('room').style.display='block';document.getElementById('roomCode').textContent=room;load();
}
function load(){const data=JSON.parse(localStorage.getItem(key())||'[]');document.getElementById('messages').innerHTML=data.map(m=>`<div class="msg"><b>${esc(m.name)}</b>: ${esc(m.text)}</div>`).join('');document.getElementById('messages').scrollTop=99999}
function send(){const el=document.getElementById('text'),text=el.value.trim();if(!text)return;const data=JSON.parse(localStorage.getItem(key())||'[]');data.push({name:username,text});localStorage.setItem(key(),JSON.stringify(data.slice(-100)));el.value='';load()}
function leave(){room='';document.getElementById('room').style.display='none';document.getElementById('join').style.display='block'}
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
setInterval(()=>{if(room)load()},1000);
</script>
</body></html>
